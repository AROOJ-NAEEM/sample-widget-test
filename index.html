<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crypto Widgets</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background: #0e0e0e;
    font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, sans-serif;
    overflow: hidden;
  }
  #tabs {
    display: flex;
    background: #1a1a1a;
  }
  #tabs button {
    flex: 1;
    padding: 8px 2px;
    background: none;
    border: none;
    color: #999;
    font-size: 10.5px;
    font-weight: 600;
    border-bottom: 2px solid transparent;
  }
  #tabs button.active {
    color: #fff;
    border-bottom-color: #2962FF;
  }
  #panes {
    position: relative;
    height: calc(100% - 32px);
    width: 100%;
  }
  .pane {
    position: absolute;
    inset: 0;
    display: none;
  }
  .pane.active { display: block; }

  /* ---- shared ---- */
  .status {
    color: #999;
    text-align: center;
    padding: 16px;
    font-size: 13px;
  }
  .retry {
    display: block;
    margin: 12px auto 0;
    padding: 6px 14px;
    border-radius: 6px;
    border: none;
    background: #2962FF;
    color: white;
    font-size: 13px;
  }
  .last-updated {
    position: absolute;
    bottom: 2px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 9px;
    color: #666;
    pointer-events: none;
    z-index: 5;
  }

  /* ---- Ticker Tape ---- */
  #ticker-viewport {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    overflow: hidden;
    background: #161616;
  }
  #ticker-track {
    display: flex;
    white-space: nowrap;
    animation: scrollTicker 22s linear infinite;
  }
  .ticker-item {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 0 16px;
  }
  .ticker-item img { width: 16px; height: 16px; border-radius: 50%; }
  .ticker-item .t-main { display: flex; flex-direction: column; }
  .ticker-item .t-sym { font-size: 13px; font-weight: 700; color: #fff; }
  .ticker-item .t-price { font-size: 11px; color: #ccc; }
  .ticker-item .t-chg { font-size: 11px; font-weight: 600; }
  .ticker-item .t-spark { width: 36px; height: 16px; flex-shrink: 0; }
  .t-up { color: #4fa64f; }
  .t-down { color: #d97a7a; }
  @keyframes scrollTicker {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }

  /* ---- Heatmap ---- */
  #treemap {
    position: relative;
    width: 100%;
    height: 100%;
  }
  .tile {
    position: absolute;
    border: 1px solid #0e0e0e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
    text-align: center;
  }
  .tile img {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    margin-bottom: 2px;
  }
  .tile .sym { font-size: 11px; font-weight: 700; line-height: 1.2; }
  .tile .chg { font-size: 10px; font-weight: 500; opacity: 0.9; line-height: 1.2; }

  /* ---- Chart ---- */
  #chart-controls {
    display: flex;
    gap: 4px;
    padding: 6px;
    background: #161616;
  }
  #chart-controls button {
    flex: 1;
    padding: 5px 0;
    font-size: 11px;
    background: #262626;
    color: #ccc;
    border: none;
    border-radius: 4px;
  }
  #chart-controls button.active {
    background: #2962FF;
    color: #fff;
  }
  #chart-container {
    width: 100%;
    height: calc(100% - 36px);
  }
  #chart-status {
    position: absolute;
    top: 50%;
    left: 0;
    right: 0;
    transform: translateY(-50%);
  }

  /* ---- Market Overview ---- */
  #overview-chart-container {
    width: 100%;
    height: 130px;
    background: #0e0e0e;
  }
  .chart-mini-status {
    text-align: center;
    font-size: 9px;
    color: #d97a7a;
    padding: 2px 0;
    min-height: 12px;
  }
  #overview-chart-controls {
    display: flex;
    gap: 4px;
    padding: 4px 6px;
    background: #161616;
  }
  #overview-chart-controls button {
    flex: 1;
    padding: 4px 0;
    font-size: 10px;
    background: #262626;
    color: #ccc;
    border: none;
    border-radius: 4px;
  }
  #overview-chart-controls button.active {
    background: #2962FF;
    color: #fff;
  }
  #overview-list {
    width: 100%;
    height: calc(100% - 176px);
    overflow-y: auto;
  }
  .ov-row {
    display: flex;
    align-items: center;
    padding: 7px 8px;
    border-bottom: 1px solid #1e1e1e;
    gap: 8px;
  }
  .ov-row.selected { background: rgba(41, 98, 255, 0.22); }
  .ov-row img { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; }
  .ov-name { flex: 1; min-width: 0; }
  .ov-name .ov-sym { font-size: 12px; font-weight: 700; color: #fff; }
  .ov-name .ov-price { font-size: 10px; color: #999; }
  .ov-spark { width: 46px; height: 20px; flex-shrink: 0; }
  .ov-chg { width: 52px; text-align: right; font-size: 11px; font-weight: 600; flex-shrink: 0; }
</style>
</head>
<body>

<div id="tabs">
  <button id="tab-ticker" class="active">Ticker</button>
  <button id="tab-heatmap">Heatmap</button>
  <button id="tab-chart">Chart</button>
  <button id="tab-overview">Overview</button>
</div>

<div id="panes">
  <div id="pane-ticker" class="pane active">
    <div id="ticker-status" class="status">Loading…</div>
    <div id="ticker-viewport"><div id="ticker-track"></div></div>
    <div id="ticker-updated" class="last-updated"></div>
  </div>

  <div id="pane-heatmap" class="pane">
    <div id="heatmap-status" class="status">Loading…</div>
    <div id="treemap"></div>
    <div id="heatmap-updated" class="last-updated"></div>
  </div>

  <div id="pane-chart" class="pane">
    <div id="chart-controls">
      <button data-interval="1h" data-limit="72">1H</button>
      <button data-interval="4h" data-limit="90" class="active">4H</button>
      <button data-interval="1d" data-limit="120">1D</button>
    </div>
    <div id="chart-container"></div>
    <div id="chart-status" class="status">Loading…</div>
    <div id="chart-updated" class="last-updated"></div>
  </div>

  <div id="pane-overview" class="pane">
    <div id="overview-chart-container"></div>
    <div id="overview-chart-status" class="chart-mini-status"></div>
    <div id="overview-chart-controls">
      <button data-days="1">1D</button>
      <button data-days="7" class="active">7D</button>
      <button data-days="30">1M</button>
      <button data-days="365">1Y</button>
    </div>
    <div id="overview-status" class="status">Loading…</div>
    <div id="overview-list"></div>
    <div id="overview-updated" class="last-updated"></div>
  </div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
  // ============================================================
  // Same-page fetch + render, no TradingView embed script, no
  // iframe anywhere. ASWebAuthenticationSession blocks cross-origin
  // iframe navigation (confirmed via Web Inspector) — everything
  // here is a plain same-frame fetch()/script tag, which is allowed.
  //
  // Covers 4 of the 6 widgets from the recommendation doc that are
  // achievable free / without an API key (crypto data only):
  //   1. Ticker Tape   2. Crypto Coins Heatmap
  //   3. Advanced Chart (candles)   4. Market Overview (crypto slice)
  // Stock Heatmap and Top Stories are NOT included — no free,
  // no-key data source exists for stock market-cap data or news;
  // both need a vendor/API-key decision first.
  // ============================================================

  const TABS = ["ticker", "heatmap", "chart", "overview"];
  const tabEls = {}, paneEls = {};
  TABS.forEach(name => {
    tabEls[name] = document.getElementById("tab-" + name);
    paneEls[name] = document.getElementById("pane-" + name);
    tabEls[name].onclick = () => switchTab(name);
  });

  let chartInitialized = false;

  function switchTab(active) {
    TABS.forEach(name => {
      const on = name === active;
      tabEls[name].classList.toggle("active", on);
      paneEls[name].classList.toggle("active", on);
    });
    if (active === "chart") {
      if (!chartInitialized) initChart(); else resizeChart();
    }
    if (active === "heatmap") {
      // The treemap needs real pixel dimensions to lay itself out — a hidden
      // pane measures 0x0, so recompute whenever this tab becomes visible.
      // Uses the shared cache — no network call unless data was never fetched.
      loadHeatmap();
    }
    if (active === "overview") {
      resizeOverviewChart();
      loadOverviewList();
    }
  }

  // ============================================================
  // Shared CoinGecko market data — Ticker, Heatmap, and the Overview
  // list all need overlapping data (price, 24h change, market cap,
  // sparkline), so they share ONE cached, deduped fetch instead of
  // each hitting CoinGecko independently. CoinGecko's free tier is
  // aggressively rate-limited (confirmed: HTTP 429 with a
  // `retry-after` header) — hitting it 3-4x per page load/tab-switch
  // was the actual cause of "Couldn't load data" everywhere. This
  // also backs off properly using that retry-after value instead of
  // hammering it again immediately.
  // ============================================================
  const MARKET_ENDPOINT = "https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=20&page=1&price_change_percentage=24h&sparkline=true";

  let marketData = null;
  let marketFetchPromise = null;
  let marketRetryAfterMs = 0;

  function getMarketData(force) {
    if (!force && marketData) return Promise.resolve(marketData);
    if (marketFetchPromise) return marketFetchPromise; // dedupe concurrent callers

    const waitMs = marketRetryAfterMs - Date.now();
    if (waitMs > 0) {
      return Promise.reject(new Error("Rate limited — retry in " + Math.ceil(waitMs / 1000) + "s"));
    }

    marketFetchPromise = fetch(MARKET_ENDPOINT)
      .then(r => {
        if (r.status === 429) {
          const retryAfter = parseInt(r.headers.get("retry-after") || "30", 10);
          marketRetryAfterMs = Date.now() + retryAfter * 1000;
          throw new Error("Rate limited by CoinGecko — retry in " + retryAfter + "s");
        }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(data => {
        marketData = data;
        marketFetchPromise = null;
        return data;
      })
      .catch(err => {
        marketFetchPromise = null;
        throw err;
      });
    return marketFetchPromise;
  }

  // Single shared refresh loop (replaces 3 separate per-tab timers) — only
  // refetches while a CoinGecko-backed tab is actually visible, and only
  // re-renders that one tab.
  setInterval(() => {
    const active = TABS.find(t => paneEls[t].classList.contains("active"));
    if (active === "ticker") loadTicker(true);
    else if (active === "heatmap") loadHeatmap(true);
    else if (active === "overview") loadOverviewList(true);
  }, 45000);

  // ---------- Ticker Tape ----------
  function loadTicker(force) {
    getMarketData(force)
      .then(coins => {
        document.getElementById("ticker-status").style.display = "none";
        const track = document.getElementById("ticker-track");
        const html = coins.slice(0, 12).map(c => tickerItemHTML(c)).join("");
        // duplicate content so the marquee loop is seamless
        track.innerHTML = html + html;
        document.getElementById("ticker-updated").textContent =
          "Updated " + new Date().toLocaleTimeString();
      })
      .catch(err => {
        const statusEl = document.getElementById("ticker-status");
        statusEl.style.display = "block";
        statusEl.innerHTML = "Couldn't load data<br><span style='font-size:11px'>" + err.message + "</span>";
      });
  }

  function tickerItemHTML(c) {
    const chg = c.price_change_percentage_24h;
    const up = chg >= 0;
    const chgClass = up ? "t-up" : "t-down";
    const chgText = (chg === null || chg === undefined) ? "—" : (up ? "+" : "") + chg.toFixed(2) + "%";
    const price = c.current_price >= 1 ? c.current_price.toFixed(2) : c.current_price.toPrecision(3);
    const spark = c.sparkline_in_7d
      ? sparklineSVG(c.sparkline_in_7d.price, up, 36, 16).replace('class="ov-spark"', 'class="t-spark"')
      : "";
    return `<span class="ticker-item">
      <img src="${c.image}">
      <span class="t-main">
        <span class="t-sym">${c.symbol.toUpperCase()}</span>
        <span class="t-price">$${price}</span>
      </span>
      ${spark}
      <span class="t-chg ${chgClass}">${chgText}</span>
    </span>`;
  }

  loadTicker();

  // ---------- Heatmap (squarified treemap, sized by market cap) ----------
  function colorFor(change) {
    if (change === null || change === undefined) return "#595959";
    if (change < -8)  return "#7f1414";
    if (change < -3)  return "#c23636";
    if (change < 0)   return "#d97a7a";
    if (change < 3)   return "#595959";
    if (change < 8)   return "#4fa64f";
    if (change < 13)  return "#2e7d2e";
    return "#0d4d0d";
  }

  function squarify(items, x, y, w, h, out) {
    if (items.length === 0) return;
    if (items.length === 1) {
      out.push({ item: items[0].item, x, y, w, h });
      return;
    }
    const total = items.reduce((s, d) => s + d.value, 0);
    const scale = (w * h) / total;
    const scaled = items.map(d => ({ item: d.item, value: d.value, area: d.value * scale }));

    const shortSide = Math.min(w, h);
    const horizontal = w <= h;

    function worst(row, side) {
      const sum = row.reduce((a, b) => a + b, 0);
      const rmax = Math.max(...row), rmin = Math.min(...row);
      return Math.max((side * side * rmax) / (sum * sum), (sum * sum) / (side * side * rmin));
    }

    let row = [];
    let i = 0;
    while (i < scaled.length) {
      const candidate = [...row, scaled[i]];
      const areas = candidate.map(d => d.area);
      const prevAreas = row.map(d => d.area);
      if (row.length === 0 || worst(areas, shortSide) <= worst(prevAreas, shortSide)) {
        row = candidate;
        i++;
      } else {
        break;
      }
    }

    const rowSum = row.reduce((s, d) => s + d.area, 0);
    let offset = 0;
    let nextRect;

    if (horizontal) {
      const rowH = rowSum / w;
      row.forEach(d => {
        const tw = d.area / rowH;
        out.push({ item: d.item, x: x + offset, y, w: tw, h: rowH });
        offset += tw;
      });
      nextRect = { x, y: y + rowH, w, h: h - rowH };
    } else {
      const rowW = rowSum / h;
      row.forEach(d => {
        const th = d.area / rowW;
        out.push({ item: d.item, x, y: y + offset, w: rowW, h: th });
        offset += th;
      });
      nextRect = { x: x + rowW, y, w: w - rowW, h };
    }

    const remaining = scaled.slice(row.length).map(d => ({ item: d.item, value: d.value }));
    squarify(remaining, nextRect.x, nextRect.y, nextRect.w, nextRect.h, out);
  }

  function renderHeatmap(coins) {
    document.getElementById("heatmap-status").style.display = "none";
    const container = document.getElementById("treemap");
    container.innerHTML = "";
    const rect = container.getBoundingClientRect();

    const items = coins
      .filter(c => c.market_cap && c.market_cap > 0)
      .map(c => ({ item: c, value: c.market_cap }));

    const placed = [];
    squarify(items, 0, 0, rect.width, rect.height, placed);

    placed.forEach(p => {
      const coin = p.item;
      const change = coin.price_change_percentage_24h;
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.style.left = p.x + "px";
      tile.style.top = p.y + "px";
      tile.style.width = p.w + "px";
      tile.style.height = p.h + "px";
      tile.style.background = colorFor(change);

      const showLogo = p.w > 30 && p.h > 34;
      const showText = p.w > 26 && p.h > 20;

      if (showLogo && coin.image) {
        const img = document.createElement("img");
        img.src = coin.image;
        tile.appendChild(img);
      }
      if (showText) {
        const sym = document.createElement("div");
        sym.className = "sym";
        sym.textContent = coin.symbol.toUpperCase();
        tile.appendChild(sym);

        const chg = document.createElement("div");
        chg.className = "chg";
        chg.textContent = (change === null || change === undefined) ? "—" :
          (change >= 0 ? "+" : "") + change.toFixed(1) + "%";
        tile.appendChild(chg);
      }
      container.appendChild(tile);
    });

    document.getElementById("heatmap-updated").textContent =
      "Updated " + new Date().toLocaleTimeString();
  }

  function loadHeatmap(force) {
    const statusEl = document.getElementById("heatmap-status");
    statusEl.style.display = "block";
    statusEl.textContent = "Loading…";

    getMarketData(force)
      .then(renderHeatmap)
      .catch(err => {
        statusEl.style.display = "block";
        statusEl.innerHTML = "Couldn't load data<br><span style='font-size:11px'>" + err.message + "</span>";
        const retry = document.createElement("button");
        retry.className = "retry";
        retry.textContent = "Retry";
        retry.onclick = () => loadHeatmap(true);
        statusEl.appendChild(retry);
      });
  }

  window.addEventListener("resize", () => {
    if (paneEls.heatmap.classList.contains("active")) loadHeatmap();
  });

  // ---------- Chart (candlesticks via TradingView's open-source Lightweight Charts) ----------
  let chart, candleSeries;
  let currentInterval = "4h", currentLimit = "90";
  const BINANCE_KLINES = (interval, limit) =>
    `https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=${interval}&limit=${limit}`;

  function initChart() {
    chartInitialized = true;
    const el = document.getElementById("chart-container");
    chart = LightweightCharts.createChart(el, {
      width: el.clientWidth,
      height: el.clientHeight,
      layout: { background: { color: "#0e0e0e" }, textColor: "#ccc" },
      grid: { vertLines: { color: "#1a1a1a" }, horzLines: { color: "#1a1a1a" } },
      timeScale: { borderColor: "#333" },
      rightPriceScale: { borderColor: "#333" },
    });
    candleSeries = chart.addCandlestickSeries({
      upColor: "#26a69a", downColor: "#ef5350",
      borderVisible: false,
      wickUpColor: "#26a69a", wickDownColor: "#ef5350",
    });

    document.querySelectorAll("#chart-controls button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("#chart-controls button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        loadChart(btn.dataset.interval, btn.dataset.limit);
      };
    });

    loadChart(currentInterval, currentLimit);
  }

  function loadChart(interval, limit) {
    currentInterval = interval;
    currentLimit = limit;
    const statusEl = document.getElementById("chart-status");
    statusEl.style.display = "block";
    statusEl.textContent = "Loading…";

    fetch(BINANCE_KLINES(interval, limit))
      .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(rows => {
        statusEl.style.display = "none";
        const data = rows.map(k => ({
          time: Math.floor(k[0] / 1000),
          open: parseFloat(k[1]),
          high: parseFloat(k[2]),
          low: parseFloat(k[3]),
          close: parseFloat(k[4]),
        }));
        candleSeries.setData(data);
        chart.timeScale().fitContent();
        document.getElementById("chart-updated").textContent =
          "Updated " + new Date().toLocaleTimeString() + " · latest candle close: " + data[data.length - 1].close;
      })
      .catch(err => {
        statusEl.innerHTML = "Couldn't load chart<br><span style='font-size:11px'>" + err.message + "</span>";
      });
  }

  function resizeChart() {
    if (!chart) return;
    const el = document.getElementById("chart-container");
    chart.resize(el.clientWidth, el.clientHeight);
  }

  window.addEventListener("resize", () => {
    resizeChart();
    resizeOverviewChart();
  });
  setInterval(() => {
    if (chartInitialized && paneEls.chart.classList.contains("active")) {
      loadChart(currentInterval, currentLimit);
    }
  }, 30000);

  // ---------- Market Overview (crypto slice) ----------
  // Modeled on TradingView's real Market Overview: a big featured chart for
  // the selected symbol on top, a selectable list below. Tapping a row swaps
  // the featured chart to that coin, same as the reference widget.
  const COIN_CHART_ENDPOINT = (id, days) =>
    `https://api.coingecko.com/api/v3/coins/${id}/market_chart?vs_currency=usd&days=${days}`;

  let overviewCoins = [];
  let selectedCoinId = "bitcoin";
  let selectedDays = "7";
  let overviewChart, overviewSeries;

  function sparklineSVG(prices, up, w, h) {
    if (!prices || prices.length < 2) return "";
    w = w || 46; h = h || 20;
    const min = Math.min(...prices), max = Math.max(...prices);
    const range = (max - min) || 1;
    const step = w / (prices.length - 1);
    const points = prices.map((p, i) => {
      const x = (i * step).toFixed(1);
      const y = (h - ((p - min) / range) * h).toFixed(1);
      return `${x},${y}`;
    }).join(" ");
    const color = up ? "#4fa64f" : "#d97a7a";
    return `<svg class="ov-spark" viewBox="0 0 ${w} ${h}"><polyline points="${points}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
  }

  function initOverviewChart() {
    const el = document.getElementById("overview-chart-container");
    overviewChart = LightweightCharts.createChart(el, {
      width: el.clientWidth,
      height: el.clientHeight,
      layout: { background: { color: "#0e0e0e" }, textColor: "#ccc" },
      grid: { vertLines: { color: "#1a1a1a" }, horzLines: { color: "#1a1a1a" } },
      timeScale: { borderColor: "#333" },
      rightPriceScale: { borderColor: "#333" },
      handleScroll: false,
      handleScale: false,
    });
    overviewSeries = overviewChart.addAreaSeries({
      lineColor: "#2962FF",
      topColor: "rgba(41, 98, 255, 0.35)",
      bottomColor: "rgba(41, 98, 255, 0.0)",
      lineWidth: 2,
    });

    document.querySelectorAll("#overview-chart-controls button").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll("#overview-chart-controls button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        selectedDays = btn.dataset.days;
        loadOverviewChart();
      };
    });
  }

  function loadOverviewChart() {
    fetch(COIN_CHART_ENDPOINT(selectedCoinId, selectedDays))
      .then(r => {
        if (r.status === 429) {
          const retryAfter = r.headers.get("retry-after") || "a bit";
          throw new Error("Rate limited — retry in " + retryAfter + "s");
        }
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(json => {
        const data = json.prices.map(p => ({ time: Math.floor(p[0] / 1000), value: p[1] }));
        overviewSeries.setData(data);
        overviewChart.timeScale().fitContent();
        document.getElementById("overview-chart-status").textContent = "";
      })
      .catch(err => {
        // The list still works even if this featured chart fails — surface
        // the reason instead of failing silently, so it's diagnosable.
        document.getElementById("overview-chart-status").textContent = err.message;
      });
  }

  function resizeOverviewChart() {
    if (!overviewChart) return;
    const el = document.getElementById("overview-chart-container");
    overviewChart.resize(el.clientWidth, el.clientHeight);
  }

  function selectCoin(id) {
    selectedCoinId = id;
    renderOverviewList();
    loadOverviewChart();
  }

  function renderOverviewList() {
    const list = document.getElementById("overview-list");
    list.innerHTML = overviewCoins.map(c => {
      const chg = c.price_change_percentage_24h;
      const up = chg >= 0;
      const chgText = (chg === null || chg === undefined) ? "—" : (up ? "+" : "") + chg.toFixed(2) + "%";
      const spark = c.sparkline_in_7d ? sparklineSVG(c.sparkline_in_7d.price, up) : "";
      const selected = c.id === selectedCoinId ? " selected" : "";
      return `<div class="ov-row${selected}" data-id="${c.id}">
        <img src="${c.image}">
        <div class="ov-name">
          <div class="ov-sym">${c.symbol.toUpperCase()}</div>
          <div class="ov-price">$${c.current_price}</div>
        </div>
        ${spark}
        <div class="ov-chg" style="color:${up ? '#4fa64f' : '#d97a7a'}">${chgText}</div>
      </div>`;
    }).join("");
    list.querySelectorAll(".ov-row").forEach(row => {
      row.onclick = () => selectCoin(row.dataset.id);
    });
  }

  let overviewChartLoadedOnce = false;

  function loadOverviewList(force) {
    const statusEl = document.getElementById("overview-status");
    statusEl.style.display = "block";
    statusEl.textContent = "Loading…";

    getMarketData(force)
      .then(coins => {
        statusEl.style.display = "none";
        overviewCoins = coins.slice(0, 12);
        if (!overviewChart) initOverviewChart();
        renderOverviewList();
        if (!overviewChartLoadedOnce) {
          overviewChartLoadedOnce = true;
          loadOverviewChart();
        }
        document.getElementById("overview-updated").textContent =
          "Updated " + new Date().toLocaleTimeString();
      })
      .catch(err => {
        statusEl.style.display = "block";
        statusEl.innerHTML = "Couldn't load data<br><span style='font-size:11px'>" + err.message + "</span>";
        const retry = document.createElement("button");
        retry.className = "retry";
        retry.textContent = "Retry";
        retry.onclick = () => loadOverviewList(true);
        statusEl.appendChild(retry);
      });
  }
</script>

</body>
</html>
